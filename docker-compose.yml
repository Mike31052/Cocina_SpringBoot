# Postgres local para desarrollo. No es para produccion.
# Levantar con: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pedidos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123a
    ports:
      - "5432:5432"
    volumes:
      - pedidos_data:/var/lib/postgresql/data

volumes:
  pedidos_data:
