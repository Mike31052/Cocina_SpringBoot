spring:
  application:
    name: pedidos-backend

  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:pedidos}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:123a}

  jpa:
    hibernate:
      # ddl-auto=update sirve para arrancar rapido en desarrollo.
      # En cuanto el modelo se estabilice, cambiar a "validate" y manejar
      # las migraciones con Flyway o Liquibase.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

server:
  port: ${PORT:8080}

app:
  zona-horaria: ${ZONA_HORARIA:America/Mexico_City}

jwt:
  # En produccion define JWT_SECRETO como variable de entorno (Railway,
  # etc). Debe ser una cadena larga y aleatoria; esta de aqui es solo
  # para arrancar en desarrollo.
  secreto: ${JWT_SECRETO:cambia-esto-por-un-secreto-largo-123456}
  expiracion-horas: ${JWT_EXPIRACION_HORAS:12}

