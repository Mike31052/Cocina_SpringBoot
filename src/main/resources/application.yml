spring:
  application:
    name: pedidos-backend

  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:pedidos}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:123a}

  jpa:
    hibernate:
      # ddl-auto=update sirve para arrancar rapido en desarrollo.
      # En cuanto el modelo se estabilice, cambiar a "validate" y manejar
      # las migraciones con Flyway o Liquibase.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: ${PORT:8080}

